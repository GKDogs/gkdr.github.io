<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Keepers Dog Pedigrees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one public pedigree sheet — header, sire/dam pickers, stats strip, 4-generation bracket that scrolls sideways on phones */
:root{
  --bg:#f3f4f7; --paper:#ffffff; --ink:#1a2130; --ink2:#566074; --rule:#d5d9e2; --accent:#7a2633; --accentT:#f6e6e9; --unk:#eef0f4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161e; --paper:#1a1f2a; --ink:#e6e9f0; --ink2:#9aa3b5; --rule:#2c3342; --accent:#e58a98; --accentT:#3a2127; --unk:#161a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --paper:#1a1f2a; --ink:#e6e9f0; --ink2:#9aa3b5; --rule:#2c3342; --accent:#e58a98; --accentT:#3a2127; --unk:#161a23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.02;margin:2px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.pick label{flex:1 1 220px;min-width:0}
.pickact{display:flex;align-items:end}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:0 14px;height:35px;cursor:pointer;font:500 13.5px var(--body)}
.btn:hover{border-color:var(--accent)}
@media (max-width:520px){.pickact{flex:1 1 100%}.pickact .btn{width:100%}}
.pick label{display:grid;gap:3px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.field{width:100%;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);padding:7px 9px;font:14px var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;border-block:1px solid var(--rule);padding-block:12px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat b.hl{color:var(--accent)}
.stat span{font-size:12px;color:var(--ink2)}
.frame{background:var(--paper);border:1px solid var(--rule);border-radius:6px;overflow-x:auto}
.ped{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));grid-template-rows:repeat(16,minmax(30px,auto));gap:2px 8px;min-width:680px;padding:10px}
.c{display:flex;flex-direction:column;justify-content:center;padding:2px 8px;border-left:3px solid var(--rule);min-width:0;border-radius:0 3px 3px 0;cursor:pointer}
.c:hover{background:var(--bg)}
.c .sd{font:9px var(--mono);letter-spacing:.1em;color:var(--ink2)}
.c .nm{font-size:13px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.c .rg{font:10.5px var(--mono);color:var(--ink2)}
.c.g1 .nm{font-size:15px;font-weight:600}
.c.rep{border-left-color:var(--accent);background:var(--accentT)}
.c.unk{background:var(--unk);border-left-style:dashed;cursor:default}
.c.unk .nm{color:var(--ink2);font-style:italic;font-size:12px}
.hint{font-size:13px;color:var(--ink2);margin:0;max-width:85ch}
.lnk{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;cursor:pointer}
.lnk:hover{text-decoration-color:var(--accent)}
.rec{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:16px 22px;align-items:start}
@media (max-width:600px){.rec{grid-template-columns:minmax(0,1fr)}}
.rec img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--rule);display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kv b{font-weight:500;overflow-wrap:anywhere}
h2{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 6px}
.grp h3{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:10px 0 4px}
.grp h3 i{font-style:normal;display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--ink)}
.names{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.sx{font:10px var(--mono);color:var(--ink2);margin-left:-11px;align-self:center}
section.blk{display:grid;gap:4px;margin-top:8px}
footer{font-size:12px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:12px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Game Keepers Dog Pedigrees</div>
    <h1 id="title">Pedigree</h1>
  </header>
  <div class="pick">
    <label for="pSire">Sire<input id="pSire" class="field" list="dlM" placeholder="Pick a male"></label>
    <label for="pDam">Dam<input id="pDam" class="field" list="dlF" placeholder="Pick a female"></label>
    <div class="pickact"><button class="btn" type="button" id="clearBtn">Clear</button></div>
  </div>
  <div id="out"></div>
  <datalist id="dlM"></datalist><datalist id="dlF"></datalist>
  <footer>Four-generation pedigree from the Game Keepers registry records as of October 30, 2026. COI is Wright's coefficient computed from every generation on record; where founders are cut off it is a floor. † parentage not yet confirmed by ADBA certificate.</footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 2) => (100 * x).toFixed(d) + "%";
const nm = id => dogs.get(id)?.name || id;
const par = id => { const d = dogs.get(id); return d ? [d.sire, d.dam] : [null, null]; };
let depthC = new Map(), kinC = new Map();
const reset = () => { depthC = new Map(); kinC = new Map(); };
function depth(id, seen = new Set()){
  if (!id || !dogs.has(id)) return -1; if (depthC.has(id)) return depthC.get(id);
  if (seen.has(id)) return 0; seen.add(id);
  const [s, d] = par(id); const v = 1 + Math.max(depth(s, seen), depth(d, seen)); depthC.set(id, v); return v;
}
function kin(a, b){
  if (!a || !b) return 0; const k = a < b ? a + "|" + b : b + "|" + a; if (kinC.has(k)) return kinC.get(k);
  let v; if (a === b){ const [s, d] = par(a); v = 0.5 * (1 + kin(s, d)); }
  else { if (depth(a) < depth(b)) [a, b] = [b, a]; const [s, d] = par(a); v = 0.5 * (kin(s, b) + kin(d, b)); }
  kinC.set(k, v); return v;
}
const F = id => { const [s, d] = par(id); return kin(s, d); };
function findByName(s){ s = (s || "").trim().toLowerCase(); if (!s) return null; for (const d of dogs.values()) if (d.name.toLowerCase() === s || d.regName.toLowerCase() === s || d.id === s) return d.id; return undefined; }

function cell(id, gen, row, span, role, counts){
  const d = id && dogs.get(id), style = `grid-column:${gen};grid-row:${row} / span ${span}`;
  if (!d) return `<div class="c unk" style="${style}"><span class="sd">${role}</span><span class="nm">Not on record</span></div>`;
  const n = counts.get(id);
  return `<div class="c g${gen}${n > 1 ? " rep" : ""}" style="${style}" data-id="${esc(id)}" tabindex="0" role="button"><span class="sd">${role}</span><span class="nm">${esc(d.regName.replace(/"/g, ""))}${d.plat ? " †" : ""}${n > 1 ? ` <span class="rg">×${n}</span>` : ""}</span><span class="rg">${esc(d.reg)}</span></div>`;
}
function pedigree(root){
  const slots = [], counts = new Map();
  (function walk(x, gen, row, span){
    if (gen > 4) return; const [s, d] = par(x), h = span / 2;
    for (const [id, r, role] of [[s, row, "SIRE"], [d, row + h, "DAM"]]){
      slots.push([id, gen, r, h, role]); if (id) counts.set(id, (counts.get(id) || 0) + 1);
      if (id) walk(id, gen + 1, r, h); else fill(gen + 1, r, h);
    }
  })(root, 1, 1, 16);
  function fill(gen, row, span){ if (gen > 4) return; const h = span / 2; slots.push([null, gen, row, h, "SIRE"], [null, gen, row + h, h, "DAM"]); fill(gen + 1, row, h); fill(gen + 1, row + h, h); }

}

        grp("Full siblings", full, d.sire && d.dam ? "None recorded." : "Needs both parents on record.") +
        grp(`Half siblings through the sire${d.sire ? ", " + esc(nm(d.sire)) : ""}`, hs, d.sire ? "None recorded." : "Sire not on record.") +
        grp(`Half siblings through the dam${d.dam ? ", " + esc(nm(d.dam)) : ""}`, hd, d.dam ? "None recorded." : "Dam not on record.")}</section>
      <section class="blk"><h2>Offspring on record</h2>${list(kids, "None recorded.")}</section>`;
  } else {
    $("#title").textContent = "Pedigree";
    out.innerHTML = `<p class="hint">Pick a sire and a dam above to see the litter's four-generation pedigree.</p>`;
  }
}
const opt = d => `<option value="${esc(d.name)}">${esc(d.regName.replace(/"/g, ""))}${d.reg ? " · " + esc(d.reg) : ""}</option>`;
const all = [...dogs.values()].sort((a, b) => a.name.localeCompare(b.name));
$("#dlM").innerHTML = all.filter(d => d.sex !== "F").map(opt).join("");
$("#dlF").innerHTML = all.filter(d => d.sex !== "M").map(opt).join("");
function fromPickers(){
  const s = findByName($("#pSire").value), d = findByName($("#pDam").value);
  if (s && d && location.hash.slice(1) !== s + "~" + d){ try { history.replaceState(null, "", "#" + s + "~" + d); } catch { location.hash = s + "~" + d; } render(); }
}
$("#pSire").addEventListener("change", fromPickers); $("#pDam").addEventListener("change", fromPickers);
$("#pSire").addEventListener("input", fromPickers); $("#pDam").addEventListener("input", fromPickers);
document.addEventListener("click", e => { const t = e.target.closest("[data-id]"); if (t){ try { history.replaceState(null, "", "#" + t.dataset.id); } catch { location.hash = t.dataset.id; } render(); window.scrollTo({top: 0}); } });
document.addEventListener("keydown", e => { if (e.key === "Enter"){ const t = e.target.closest?.("[data-id]"); if (t) t.click(); } });
window.addEventListener("hashchange", render);
$("#clearBtn").addEventListener("click", () => {
  $("#pSire").value = ""; $("#pDam").value = "";
  try { history.replaceState(null, "", location.pathname + location.search); } catch { location.hash = ""; }
  render(); window.scrollTo({top: 0}); $("#pSire").focus();
});
render();
})();
</script>
